<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>حاسبة القطع</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- واجهة اختيار اللغة -->
<div id="langScreen" class="screen active">
  <h1 id="langScreenTitle">زمان</h1>
  <p id="langScreenDesc" style="text-align:center; margin-bottom: 20px;">الرجاء اختيار اللغة</p>
  <div class="lang-buttons">
    <button onclick="selectLang('ku')">کوردی</button>
    <button onclick="selectLang('ar')">العربية</button>
  </div>
</div>

<!-- واجهة الإدخال -->
<div id="inputScreen" class="screen">
  
  <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; margin-bottom: 15px; margin-top: 10px;">
    
    <!-- رابط التيك توك -->
    <a href="https://www.tiktok.com/@hiwa_anwar?_r=1&_t=ZS-9AePONcEVX6" target="_blank" class="tiktok-badge" style="text-decoration: none;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
        <path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64 2.93 2.93 0 0 1 .88.13V9.4a6.84 6.84 0 0 0-1-.05A6.33 6.33 0 0 0 5 20.1a6.34 6.34 0 0 0 10.86-4.43v-7a8.16 8.16 0 0 0 4.77 1.52v-3.4a4.85 4.85 0 0 1-1-.1z"/>
      </svg>
      <span>@hiwa_anwar</span>
    </a>

    <!-- رابط الاتصال والدفع -->
    <a href="tel:07709317199" class="contact-badge" style="text-decoration: none;">
      <span>📞 07709317199</span>
      <span style="color: #1e3a5f; margin: 0 4px;">|</span>
      <span>💳 کیا (Kiya)</span>
    </a>

  </div>

  <h1 id="titleInput">حاسبة القطع</h1>

  <div class="card">
    <h2 id="labelBoard">قياس اللوح الكامل</h2>
    <div class="row">
      <input type="number" id="boardW" placeholder="العرض (سم)" inputmode="decimal">
      <input type="number" id="boardH" placeholder="الطول (سم)" inputmode="decimal">
    </div>
    <div class="row">
      <input type="number" id="kerf" placeholder="سماكة المنشار (سم)" value="0.3" step="0.1" inputmode="decimal">
    </div>
  </div>

  <div class="card">
    <h2 id="labelPieces">القطع المطلوبة</h2>
    <div id="piecesList"></div>
    <button class="btn-add" onclick="addPieceRow()" id="btnAddPiece">+ إضافة قطعة</button>
  </div>

  <button class="btn-primary" onclick="calculate()" id="btnCalc">احسب</button>
</div>

<!-- واجهة النتائج -->
<div id="resultScreen" class="screen">
  <div class="result-header">
    <button onclick="goBack()" class="btn-back">←</button>
    <h2 id="labelResult">مخطط القطع</h2>
  </div>
  <div id="resultInfo" class="info"></div>
  <div id="svgContainer" class="svg-box"></div>
  <button class="btn-primary" onclick="goBack()" id="btnAgain">قطع جديد</button>
</div>

<script src="packer.js"></script>
<script src="app.js"></script>
</body>
</html>
